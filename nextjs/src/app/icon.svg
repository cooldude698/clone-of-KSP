<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#070A12" />
      <stop offset="100%" stop-color="#030509" />
    </linearGradient>

    <!-- Outer 'D' Ribbon Gradient -->
    <linearGradient id="dRibbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="35%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Electric Sapphire Glowing Rim Stroke -->
    <linearGradient id="sapphireGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="75%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Eye Body Glass Gradient -->
    <linearGradient id="eyeGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Core Pupil Glow -->
    <radialGradient id="pupilCoreGrad" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="40%" stop-color="#00F0FF" />
      <stop offset="75%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="sapphireFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradB)" />
  <rect width="506" height="506" x="3" y="3" rx="125" fill="none" stroke="#1E293B" stroke-width="3" opacity="0.6" />

  <!-- ─── CONCEPT B: FLUID CYBER EYE 'D' MONOGRAM ─── -->
  <g transform="translate(256, 256)">
    
    <!-- Outer 'D' Curved Shell (The Back Spine & Outer Loop) -->
    <g filter="url(#sapphireFilter)">
      <!-- Outer Rim Glow Path -->
      <path 
        d="M -70 -160 
           C 40 -160, 165 -90, 165 20 
           C 165 125, 65 175, -55 175 
           C -95 175, -125 160, -125 140
           L -125 70 
           C -125 65, -115 60, -100 60
           C -30 60, 95 30, 95 -20
           C 95 -75, 15 -110, -70 -110
           Z" 
        fill="url(#dRibbonGrad)"
        stroke="url(#sapphireGlow)"
        stroke-width="7"
        stroke-linejoin="round"
      />
    </g>

    <!-- Inner Aerodynamic Eye Contour (Sweeping beak / aperture) -->
    <g filter="url(#sapphireFilter)">
      <path 
        d="M -165 -10 
           C -90 -85, 35 -85, 95 -10 
           C 35 65, -90 65, -165 -10 Z" 
        fill="url(#eyeGlassGrad)" 
        stroke="url(#sapphireGlow)" 
        stroke-width="8" 
        stroke-linejoin="round"
      />
    </g>

    <!-- Eye Iris Ring -->
    <circle cx="-35" cy="-10" r="48" fill="#090D16" stroke="url(#sapphireGlow)" stroke-width="5" />

    <!-- Luminous Central Pupil Core -->
    <circle cx="-35" cy="-10" r="28" fill="url(#pupilCoreGrad)" />
    
    <!-- High-Tech Specular Highlight -->
    <circle cx="-45" cy="-20" r="8" fill="#FFFFFF" opacity="0.9" />
    <circle cx="-25" cy="-2" r="3.5" fill="#FFFFFF" opacity="0.6" />

    <!-- Bottom Tail Flare Arc -->
    <path 
      d="M -125 140 C -70 160, 20 155, 75 110" 
      fill="none" 
      stroke="url(#sapphireGlow)" 
      stroke-width="4" 
      stroke-linecap="round"
      opacity="0.75"
    />
  </g>
</svg>
