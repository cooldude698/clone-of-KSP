<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="#000000" />

  <!-- The Exact Solar Vision / Eye Emblem (White Vector) -->
  <g fill="#FFFFFF">
    <!-- ── 6 Radiant Spikes (Seamless with eye boundary) ── -->
    <!-- Top Center Spike -->
    <polygon points="256,65 278,172 234,172" />
    
    <!-- Top Left Diagonal Spike -->
    <polygon points="152,125 208,188 174,212" />
    
    <!-- Top Right Diagonal Spike -->
    <polygon points="360,125 338,212 304,188" />

    <!-- Bottom Center Spike -->
    <polygon points="256,447 234,340 278,340" />
    
    <!-- Bottom Left Diagonal Spike -->
    <polygon points="152,387 174,300 208,324" />
    
    <!-- Bottom Right Diagonal Spike -->
    <polygon points="360,387 304,324 338,300" />

    <!-- ── Outer Eye Contour Ring ── -->
    <path 
      d="M 72 256 
         C 135 158, 377 158, 440 256 
         C 377 354, 135 354, 72 256 Z
         M 124 256 
         C 168 190, 344 190, 388 256 
         C 344 322, 168 322, 124 256 Z" 
      fill-rule="evenodd" 
    />

    <!-- ── Inner Eye Swirling Wave Crest ── -->
    <path 
      d="M 128 256 
         C 172 196, 340 196, 384 256 
         C 340 236, 290 232, 236 242 
         C 185 252, 180 286, 226 294 
         C 268 300, 294 286, 308 274 
         C 286 300, 246 314, 206 308 
         C 152 300, 140 272, 128 256 Z" 
    />
  </g>
</svg>
