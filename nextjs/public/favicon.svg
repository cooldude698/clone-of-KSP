<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="#000000" />

  <!-- Magnifying Vision Eye Emblem (White Vector) -->
  <g fill="#FFFFFF" stroke="#FFFFFF">
    <!-- Main Lens Arc -->
    <path
      d="M 95 230 A 135 135 0 1 1 135 325"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="40"
      stroke-linecap="round"
    />
    <!-- Lens Handle -->
    <line
      x1="325" y1="325"
      x2="380" y2="380"
      stroke="#FFFFFF"
      stroke-width="40"
      stroke-linecap="round"
    />
    <!-- Inner Stylized Pupil -->
    <path
      d="M 195 142
         C 195 175, 230 195, 255 190
         C 275 186, 285 198, 282 225
         A 75 75 0 1 1 195 142 Z"
      fill="#FFFFFF"
      stroke="none"
    />
    <!-- Radar / Exclamation Dot -->
    <circle cx="435" cy="435" r="32" fill="#FFFFFF" stroke="none" />
  </g>
</svg>
