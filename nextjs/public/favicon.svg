<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Executive Midnight Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Facet 1: Primary Royal Cobalt -->
    <linearGradient id="facetPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Facet 2: Deep Indigo Glass -->
    <linearGradient id="facetDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Facet 3: Titanium Highlight -->
    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Core Eye Luminous Glow -->
    <radialGradient id="coreLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </radialGradient>
  </defs>

  <!-- Container Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="125" fill="none" stroke="#334155" stroke-width="3" opacity="0.5" />

  <!-- Interlocking geometric shield & lens facets forming the signature 'D' of Drishti -->
  <g transform="translate(256, 256)">
    <!-- Top-Left Facet -->
    <path 
      d="M 0 -150 L 120 -80 C 135 -70, 145 -55, 145 -35 L 145 0 L 60 0 L 60 -45 L 0 -80 Z" 
      fill="url(#facetHighlight)" 
    />

    <!-- Bottom-Right Facet Curve (forming the 'D' loop) -->
    <path 
      d="M 145 0 L 145 35 C 145 95, 95 145, 30 145 L -100 145 L -100 70 L 20 70 C 55 70, 75 50, 75 15 L 75 0 Z" 
      fill="url(#facetPrimary)" 
    />

    <!-- Left Tactical Spine (Vertical Law Enforcement Pillar) -->
    <path 
      d="M -100 -145 L -35 -145 L -35 145 L -100 145 Z" 
      fill="url(#facetDeep)" 
    />

    <!-- Diagonal Optical Ray Bridge -->
    <path 
      d="M -35 -145 L 0 -150 L -35 -85 Z" 
      fill="#60A5FA" 
      opacity="0.8"
    />

    <!-- Precision Central Optical Lens / All-Seeing Iris Core -->
    <circle cx="20" cy="0" r="38" fill="#020617" stroke="#38BDF8" stroke-width="8" />
    <circle cx="20" cy="0" r="18" fill="url(#coreLight)" />
    <circle cx="14" cy="-6" r="5" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>
