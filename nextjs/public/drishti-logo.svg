<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 180" width="100%" height="100%">
  <!-- Left: Black Squircle with White Solar Eye Emblem -->
  <g transform="translate(15, 15)">
    <rect width="150" height="150" rx="38" fill="#000000" />

    <g transform="translate(75, 75) scale(0.28)" fill="#FFFFFF">
      <!-- Top Center Spike -->
      <polygon points="0,-191 22,-84 -22,-84" />
      <!-- Top Left Diagonal Spike -->
      <polygon points="-104,-131 -48,-68 -82,-44" />
      <!-- Top Right Diagonal Spike -->
      <polygon points="104,-131 82,-44 48,-68" />

      <!-- Bottom Center Spike -->
      <polygon points="0,191 -22,84 22,84" />
      <!-- Bottom Left Diagonal Spike -->
      <polygon points="-104,131 -82,44 -48,68" />
      <!-- Bottom Right Diagonal Spike -->
      <polygon points="104,131 48,68 82,44" />

      <!-- Outer Eye Contour Ring -->
      <path 
        d="M -184 0 
           C -121 -98, 121 -98, 184 0 
           C 121 98, -121 98, -184 0 Z
           M -132 0 
           C -88 -66, 88 -66, 132 0 
           C 88 66, -88 66, -132 0 Z" 
        fill-rule="evenodd" 
      />

      <!-- Inner Eye Wave Crest -->
      <path 
        d="M -128 0 
           C -84 -60, 84 -60, 128 0 
           C 84 -20, 34 -24, -20 -14 
           C -71 -4, -76 30, -30 38 
           C 12 44, 38 30, 52 18 
           C 30 44, -10 58, -50 52 
           C -104 44, -116 16, -128 0 Z" 
      />
    </g>
  </g>

  <!-- Right: Clean Typography -->
  <g transform="translate(195, 0)">
    <g transform="translate(0, 55)">
      <text font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#38BDF8" letter-spacing="1">
        ದೃಷ್ಟಿ
      </text>
      <rect x="62" y="-16" width="96" height="22" rx="6" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="73" cy="-5" r="3" fill="#10B981" />
      <text x="83" y="-5" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#38BDF8" letter-spacing="1">
        KSP AI
      </text>
    </g>

    <text x="0" y="112" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="50" font-weight="900" fill="#FFFFFF" letter-spacing="4">
      DRISHTI
    </text>

    <g transform="translate(2, 142)">
      <text font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#38BDF8" letter-spacing="3">
        KARNATAKA STATE POLICE
      </text>
      <text x="215" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#71717A" letter-spacing="1.5">
        • TACTICAL INTELLIGENCE
      </text>
    </g>
  </g>
</svg>
